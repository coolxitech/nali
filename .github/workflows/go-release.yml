name: Go Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-binary:
    name: Release Binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Test
        run: go test ./...

      - name: Build
        env:
          NAME: nali
          BINDIR: bin
        # deb packages are built from the plain binaries before `releases` compresses them
        run: make -j"$(nproc)" deb && make -j"$(nproc)" releases && make sha256sum

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          files: bin/*
          draft: true
          prerelease: true
          generate_release_notes: true

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: bin
